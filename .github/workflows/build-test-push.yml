name: Build Test and Push Docker Image
on:
  push:
    branches:
      - main
      - 52-github-actions-improvement
  pull_request:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: debug envs
        run: |
          echo "Dockerhub username variable: $DOCKERHUB_USERNAME"
          echo "Dockerhub token: $DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          # username: zimnyciechan
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./eventice-backend
          push: true
          tags: zimnyciechan/eventice-backend:latest
