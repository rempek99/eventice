name: Build Test and Push Docker Image
on:
  push:
    branches:
      - main
      - 52-github-actions-improvement
  pull_request:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: debug envs
        run: |
          echo "Dockerhub username variable: $DOCKERHUB_USERNAME"
          echo "Dockerhub token: $DOCKERHUB_TOKEN"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Extract Backend Version
        id: extract_version_backend
        run: |
          VERSION=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' eventice-backend/pom.xml)
          echo "VERSION=$VERSION"
          echo "version_backend=$VERSION" >> $GITHUB_ENV
      - name: Extract Frontend Version
        id: extract_version_frontend
        run: |
          VERSION=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' eventice-frontend/package.json)
          echo "VERSION=$VERSION"
          echo "version_frontend=$VERSION" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./eventice-backend
          push: true
          tags: zimnyciechan/eventice-backend:${{ env.version_backend }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./eventice-frontend
          push: true
          tags: zimnyciechan/eventice-frontend:${{ env.version_frontend }}
