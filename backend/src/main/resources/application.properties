spring.application.name=eventice
server.port=8080
# server.servlet.context-path=/api

# Aktywny profil (możesz nadpisać przez zmienną środowiskową lub parametr JVM)
# spring.profiles.active=test

# For init data.sql scripts on start
# spring.sql.init.mode=ALWAYS
# spring.jpa.defer-datasource-initialization=true

# JWT Security settings
security.jwt.secret-key=${JWT_SECRET}
# 1h in millisecond
security.jwt.expiration-time=3600000 

# Printing all added filters to the filter chain
logging.level.org.springframework.security.web.DefaultSecurityFilterChain=DEBUG
logging.level.org.springframework.security=DEBUG
server.error.include-stacktrace=never

eventice.frontendUrl=http://localhost:4200

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=${DB_URL}
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.hibernate.ddl-auto=update



